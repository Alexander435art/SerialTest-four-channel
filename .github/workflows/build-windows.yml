         name: Build SerialTest for Windows

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2 and MinGW 8.1.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Extract source and original runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceZip = '.\SerialTest_four_channel_source.zip'
          $runtimeZip = '.\蓝牙串口上位机_original.zip'
          if (!(Test-Path -LiteralPath $sourceZip)) { throw "Missing $sourceZip in repository root" }
          if (!(Test-Path -LiteralPath $runtimeZip)) { throw "Missing $runtimeZip in repository root" }

          Expand-Archive -LiteralPath $sourceZip -DestinationPath '.\source' -Force
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath '.\original' -Force

          $project = Get-ChildItem '.\source' -Filter 'SerialTest.pro' -File -Recurse | Select-Object -First 1
          if (!$project) { throw 'Could not find SerialTest.pro inside the source ZIP' }
          $srcDir = $project.Directory.FullName

          Invoke-WebRequest -Uri 'https://www.qcustomplot.com/release/2.1.1/QCustomPlot-source.tar.gz' -OutFile '.\qcustomplot.tar.gz'
          New-Item -ItemType Directory -Force -Path '.\qcustomplot' | Out-Null
          tar -xzf '.\qcustomplot.tar.gz' -C '.\qcustomplot'
          $qcpCpp = Get-ChildItem '.\qcustomplot' -Filter 'qcustomplot.cpp' -File -Recurse | Select-Object -First 1
          $qcpH = Get-ChildItem '.\qcustomplot' -Filter 'qcustomplot.h' -File -Recurse | Select-Object -First 1
          if (!$qcpCpp -or !$qcpH) { throw 'Could not find QCustomPlot source files in the downloaded archive' }
          Copy-Item $qcpCpp.FullName (Join-Path $srcDir 'qcustomplot.cpp') -Force
          Copy-Item $qcpH.FullName (Join-Path $srcDir 'qcustomplot.h') -Force
          "SERIALTEST_SOURCE_DIR=$srcDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build SerialTest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SERIALTEST_SOURCE_DIR
          qmake SerialTest.pro 'CONFIG+=release'
          if ($LASTEXITCODE -ne 0) { throw 'qmake failed' }
          mingw32-make -j2
          if ($LASTEXITCODE -ne 0) { throw 'mingw32-make failed' }
          Pop-Location

          $exe = Get-ChildItem $env:SERIALTEST_SOURCE_DIR -Filter 'SerialTest.exe' -File -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Build completed but SerialTest.exe was not found' }
          $deploy = Join-Path $PWD 'SerialTest_四通道可运行版'
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null
          Copy-Item $exe.FullName (Join-Path $deploy 'SerialTest.exe') -Force
          windeployqt --release --compiler-runtime --no-translations (Join-Path $deploy 'SerialTest.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }

          $pref = Get-ChildItem '.\original' -Filter 'preference.ini' -File -Recurse | Select-Object -First 1
          if ($pref) {
            Copy-Item $pref.FullName $deploy -Force
            foreach ($dataName in @('压力', '拉伸')) {
              $dataFile = Get-ChildItem $pref.Directory.FullName -File | Where-Object { $_.Name -eq $dataName } | Select-Object -First 1
              if ($dataFile) { Copy-Item $dataFile.FullName $deploy -Force }
            }
          }

          @'
          SerialTest four-channel Windows build
          Backup your existing application folder before replacing it.
          Test Bluetooth/serial connection, all four channels, X/Y zoom and pan, and data saving before regular use.
          '@ | Set-Content -Encoding UTF8 (Join-Path $deploy '使用说明.txt')
          Compress-Archive -Path (Join-Path $deploy '*') -DestinationPath (Join-Path $PWD 'SerialTest_四通道可运行版_Windows.zip') -Force

      - name: Upload Windows application package
        uses: actions/upload-artifact@v4
        with:
          name: SerialTest-四通道-Windows
          path: SerialTest_四通道可运行版_Windows.zip
          if-no-files-found: error
